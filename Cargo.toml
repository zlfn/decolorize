[package]
name = "decolorize"
version = "0.2.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
description = "Contrast preserving decolorization (Lu, Xu & Jia)"
repository = "https://github.com/zlfn/decolorize"
readme = "README.md"
keywords = ["image", "grayscale", "decolorization", "contrast", "color"]
categories = ["multimedia::images", "algorithms"]
exclude = ["rust-toolchain.toml", "comparison.png"]

[features]
default = ["rayon"]
rayon = ["dep:rayon", "image/rayon"]

[dependencies]
image = { version = "0.25.8", default-features = false }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
rayon = { version = "1.10.0", optional = true, default-features = false }

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
