[package]
name = "decolorize"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
description = "Contrast preserving decolorization (Lu, Xu & Jia)"

[features]
default = ["rayon", "image/default"]
rayon = ["dep:rayon", "image/rayon"]

[dependencies]
image = { version = "0.25.8", default-features = false }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
rayon = { version = "1.10.0", optional = true, default-features = false }

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
